services:
  error_free_text_postgres:
    image: postgres:18.3
    container_name: error-free-text-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - error_free_text_data:/var/lib/postgresql

volumes:
  error_free_text_data: